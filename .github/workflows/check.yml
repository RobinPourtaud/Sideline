name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build && npm run build:firefox && npm run build:safari
      - run: npx web-ext lint --source-dir .output/firefox-mv3 --warnings-as-errors
  browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - if: matrix.browser == 'webkit'
        run: npm run build:safari
      - run: npx playwright test --project=${{ matrix.browser }} --grep-invert "installed Chrome"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
  installed:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - if: matrix.browser == 'chromium'
        run: npm run build && npx playwright test --project=chromium --grep "installed Chrome"
      - if: matrix.browser == 'firefox'
        name: Install geckodriver
        run: |
          curl -fsSL https://github.com/mozilla/geckodriver/releases/download/v0.37.1/geckodriver-v0.37.1-linux64.tar.gz -o /tmp/geckodriver.tar.gz
          echo "e815130ea95983e162ae91843b48d3a3ce991735635fce83a647afde21e09f7e  /tmp/geckodriver.tar.gz" | sha256sum -c -
          tar -xzf /tmp/geckodriver.tar.gz -C /tmp
      - if: matrix.browser == 'firefox'
        run: npm run build:firefox && npm run test:firefox-extension
        env:
          GECKODRIVER: /tmp/geckodriver
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: installed-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/

  safari-package:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:safari
      - name: Compile Mac wrapper without signing
        run: >-
          xcodebuild -project safari/Sideline/Sideline.xcodeproj
          -scheme Sideline -configuration Release -destination 'platform=macOS'
          -derivedDataPath .output/safari-derived CODE_SIGNING_ALLOWED=NO build
