name: Feature idea
description: Suggest something that would make Sideline better.
title: "[Idea] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would this help you do?
      description: Describe the situation or problem you want to improve.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: A rough idea is welcome. You do not need a technical solution.
    validations:
      required: true
