name: Bug report
description: Tell us what went wrong and how to reproduce it.
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include what you expected and what you actually saw.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: Use synthetic examples where possible. Do not include private chat, cookies, or credentials.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Sideline version
      placeholder: "0.2.0"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: Chrome 141, macOS / Firefox 143, Windows
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Screenshots or extra context
      description: Include display style, density, fullscreen state, and whether it was live chat, replay chat, or a timed comment.
